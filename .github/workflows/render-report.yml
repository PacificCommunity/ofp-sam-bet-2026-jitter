name: Render Diagnostic model jitter report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            github::PacificCommunity/ofp-sam-flr4mfcl@ff8367fcec19baff98333170c0f1bca3f9903029
            github::PacificCommunity/mfclshiny@67a4dbafd170405e9d54383ef07b1e7790639da9
          needs: website

      - name: Validate and render
        run: ./run-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-model-jitter-report
          path: results/
          if-no-files-found: error
