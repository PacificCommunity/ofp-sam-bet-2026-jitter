name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          sha256sum -c data/SHA256SUMS
          ./verify-native-pars - > "$RUNNER_TEMP/jitter-native-validation.csv"
          python3 ci/verify-preserved-files.py
          git diff --exit-code
